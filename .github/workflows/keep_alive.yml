name: Mantener Supabase Activo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 08,20 * * *"

permissions:
  contents: read

concurrency:
  group: mantener-supabase-activo
  cancel-in-progress: true

jobs:
  ping:
    name: Verificar Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Preparar URL del proyecto
        id: prepare
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail

          REF="$(printf '%s' "${SUPABASE_PROJECT_REF:-}" | tr -d '\r\n "' | tr '[:upper:]' '[:lower:]')"
          RAW_URL="$(printf '%s' "${SUPABASE_URL:-}" | tr -d '\r\n "')"

          if [ -n "$REF" ]; then
            if ! printf '%s' "$REF" | grep -Eq '^[a-z0-9]+$'; then
              echo "::error::SUPABASE_PROJECT_REF contiene caracteres inválidos."
              exit 1
            fi

            BASE_URL="https://${REF}.supabase.co"

          elif [ -n "$RAW_URL" ]; then
            case "$RAW_URL" in
              http://*|https://*)
                BASE_URL="${RAW_URL%/}"
                ;;
              *)
                BASE_URL="https://${RAW_URL%/}"
                ;;
            esac

            BASE_URL="${BASE_URL%%\?*}"
            BASE_URL="${BASE_URL%%\#*}"

            if ! printf '%s' "$BASE_URL" | grep -Eq '^https://[a-z0-9.-]+\.supabase\.(co|in)$'; then
              echo "::error::SUPABASE_URL no tiene un formato válido."
              echo "::error::Formato esperado: https://TU-PROYECTO.supabase.co"
              exit 1
            fi

          else
            echo "::error::Falta SUPABASE_PROJECT_REF o SUPABASE_URL en Repository secrets."
            exit 1
          fi

          HOST="${BASE_URL#https://}"
          HOST="${HOST%%/*}"

          if [ -z "$HOST" ]; then
            echo "::error::No se pudo obtener el host de Supabase."
            exit 1
          fi

          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Proyecto preparado: $HOST"

      - name: Comprobar resolución DNS
        shell: bash
        env:
          HOST: ${{ steps.prepare.outputs.host }}
        run: |
          set -euo pipefail

          echo "Resolviendo DNS para: $HOST"

          if ! getent ahosts "$HOST" > /dev/null 2>&1; then
            echo "::error::No se pudo resolver el host $HOST."
            echo "::error::Revisa que SUPABASE_PROJECT_REF o SUPABASE_URL coincidan exactamente con tu proyecto."
            exit 1
          fi

          echo "DNS correcto."

      - name: Consultar salud de Supabase
        shell: bash
        env:
          BASE_URL: ${{ steps.prepare.outputs.base_url }}
        run: |
          set -euo pipefail

          URL="${BASE_URL%/}/auth/v1/health"
          echo "Consultando: $URL"

          HTTP_CODE="$(
            curl               --silent               --show-error               --location               --retry 3               --retry-delay 4               --retry-all-errors               --connect-timeout 15               --max-time 45               --output health.json               --write-out "%{http_code}"               "$URL"
          )"

          echo "Código HTTP: $HTTP_CODE"
          cat health.json || true

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Supabase respondió con HTTP $HTTP_CODE."
            exit 1
          fi

          echo "Supabase respondió correctamente."
