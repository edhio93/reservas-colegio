name: Mantener Supabase Activo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 08,20 * * *"

permissions:
  contents: read

concurrency:
  group: mantener-supabase-activo
  cancel-in-progress: true

jobs:
  ping:
    name: Verificar Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Preparar URL del proyecto
        id: prepare
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail

          REF="$(printf '%s' "${SUPABASE_PROJECT_REF:-}" | tr -d '\r\n "' | tr '[:upper:]' '[:lower:]')"
          RAW_URL="$(printf '%s' "${SUPABASE_URL:-}" | tr -d '\r\n "')"

          if [ -n "$REF" ]; then
            if ! printf '%s' "$REF" | grep -Eq '^[a-z0-9]+$'; then
              echo "::error::SUPABASE_PROJECT_REF contiene caracteres inválidos."
              exit 1
            fi
            BASE_URL="https://${REF}.supabase.co"
          elif [ -n "$RAW_URL" ]; then
            BASE_URL="$(
              python - "$RAW_URL" <<'PY'
import sys
from urllib.parse import urlsplit

raw = sys.argv[1].strip().rstrip("/")
if "://" not in raw:
    raw = "https://" + raw

parts = urlsplit(raw)
if parts.scheme != "https" or not parts.netloc:
    raise SystemExit("URL inválida")

print(f"https://{parts.netloc}")
PY
            )"
          else
            echo "::error::Falta SUPABASE_PROJECT_REF o SUPABASE_URL en Repository secrets."
            exit 1
          fi

          HOST="$(
            python - "$BASE_URL" <<'PY'
import sys
from urllib.parse import urlsplit
print(urlsplit(sys.argv[1]).hostname or "")
PY
          )"

          if [ -z "$HOST" ]; then
            echo "::error::No se pudo extraer el host de Supabase."
            exit 1
          fi

          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Proyecto preparado: $HOST"

      - name: Comprobar resolución DNS
        shell: bash
        env:
          HOST: ${{ steps.prepare.outputs.host }}
        run: |
          set -euo pipefail

          echo "Resolviendo DNS para: $HOST"

          if ! getent ahosts "$HOST"; then
            echo "::error::No se pudo resolver $HOST."
            echo "::error::Revisa que el Project URL o Project Ref coincida exactamente con Supabase."
            exit 1
          fi

      - name: Consultar salud del servicio
        shell: bash
        env:
          BASE_URL: ${{ steps.prepare.outputs.base_url }}
        run: |
          set -euo pipefail

          URL="${BASE_URL%/}/auth/v1/health"
          echo "Consultando: $URL"

          HTTP_CODE="$(
            curl               --silent               --show-error               --location               --retry 3               --retry-delay 4               --retry-all-errors               --connect-timeout 15               --max-time 45               --output health.json               --write-out "%{http_code}"               "$URL"
          )"

          echo "Código HTTP: $HTTP_CODE"
          cat health.json || true

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Supabase respondió con HTTP $HTTP_CODE."
            exit 1
          fi

          echo "Supabase respondió correctamente."
