# Archivo: .github/workflows/despertador.yml
name: Despertador de Streamlit

on:
  schedule:
    # Esto usa formato Cron. "0 10 * * *" significa que correrá todos los días a las 10:00 AM UTC (aprox 6:00 AM en Chile)
    - cron: "0 10 * * *" 
  workflow_dispatch: # Esto te agrega un botón en GitHub para ejecutarlo manualmente cuando quieras

jobs:
  visitar_app:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del navegador
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Ejecutar el visitante fantasma
        run: python keep_alive.py
